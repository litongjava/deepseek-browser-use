# 发行包里内嵌的 Chromium 构建号(Playwright 的浏览器修订号)。
#
# scripts/package/build-release.mjs 用它拼下载地址:
#   https://cdn.playwright.dev/dbazure/download/playwright/builds/chromium/<revision>/chromium-<平台>.zip
# BundledBrowserRevisionTest 会校验它与当前 Playwright 版本要求的修订号一致,
# 所以升级 Playwright 依赖后如果这个值没跟着改,构建会直接失败。
chromium.revision=1179

# ---------------------------------------------------------------------------
# 浏览器与 profile(见 ChromeBrowser / PlaywrightService)
#
# 默认使用本机安装的 Google Chrome + 一个**专用共享 profile**:所有任务共用一个 Chrome
# 进程、一份 profile,任务之间靠页签隔离(不再一个任务一个浏览器 —— 用户数据目录天生是
# 单例,同一个目录同时只允许一个 Chrome 进程)。agent 第一次登录某个站点后,登录态就留在
# 这份 profile 里,后续任务不用再登。下面每一项都可以用系统属性、环境变量(全大写下划线,
# 例如 BROWSER_CHROME_PATH)、或者 tio-boot 的 app.properties / .env 覆盖,优先级高于本文件。
# ---------------------------------------------------------------------------

# 是否使用本机安装的 Google Chrome。false 时完全退回内嵌 Chromium + 托管 profile
browser.chrome.enabled=true

# Chrome 可执行文件。留空时按平台惯例探测(Windows 还会查注册表 App Paths\chrome.exe)
# browser.chrome.path=C:\Program Files\Google\Chrome\Application\chrome.exe

# 用户数据目录(User Data)。留空时按平台惯例探测:
#   Windows  %LOCALAPPDATA%\Google\Chrome\User Data
#   macOS    ~/Library/Application Support/Google/Chrome
#   Linux    $XDG_CONFIG_HOME/google-chrome 或 ~/.config/google-chrome
# 只有 browser.chrome.useUserProfile=true 时才会用到它。
# browser.chrome.userDataDir=

# 用用户数据目录里的哪个子 profile。默认 Default;填 auto 时读 Local State 里的
# profile.last_used(Chrome 自己记的「上次用的 profile」);填空串表示不传
# --profile-directory。
browser.chrome.profileDirectory=Default

# 用户 profile 被占用(Chrome 正在运行)或启动失败时,是否退回托管 profile。
# false 时直接报错,不再悄悄换一份 profile。
browser.chrome.profileFallback=true

# 是否直接用用户自己的 Chrome 用户数据目录(也就是你日常在用的那份 profile、现成的登录态)。
#
# 默认 false,原因是 Chrome 136 起**不允许在默认用户数据目录上开启远程调试**:
#   DevTools remote debugging requires a non-default data directory. Specify this using --user-data-dir.
# 注意 --remote-debugging-pipe(Playwright 的 launchPersistentContext)和
# --remote-debugging-port 都被拒绝,所以 Playwright / Puppeteer / Selenium 都接不上你的
# 真实 profile;把 profile 复制到别处也不行 —— Chrome 的 App-Bound 加密会让 cookie 解不开
# (实测原 profile 有 1421 个 cookie,复制后读到 0 个)。
#
# 想真的用上用户 profile(打开这个开关后才会走这条路:自己拉 Chrome +
# --remote-debugging-port + connectOverCDP),需要这台机器允许远程调试默认 profile:
# 给 HKLM\SOFTWARE\Policies\Google\Chrome 加上 DWORD RemoteDebuggingAllowed=1(需管理员,
# 机器级生效,代价是本机任何进程都能用远程调试读你的 profile),或者使用 Chrome 136 之前的版本。
# 不满足条件时 start 会带着 note 退回托管 profile,不会把服务卡住。
browser.chrome.useUserProfile=false

# CDP 那条路(本机 Chrome + 自己拉进程 + --remote-debugging-port)默认用的托管 profile 目录。
#
# 默认 ~/.config/browseruse/profiles/shared-default。**刻意不按端口派生**:这条路用的是托管
# profile,本来就不会和你正在开的 Chrome 抢目录,所以「换端口 = 换一套登录态」在这里是没有必要的
# 损失;固定成 shared-default 之后,换端口不换登录态。
#
# 优先级:browser.chrome.cdpProfileDir > browser.profileDir(显式配置永远优先)> shared-default。
# 想沿用旧的托管目录(profiles/shared)就显式配 browser.profileDir 指过去。
#
# 想让 agent 用上你日常那份 Chrome 的登录态,请打开上面的 browser.chrome.useUserProfile ——
# 那用的是系统默认的 User Data,和这一份是两回事。
# browser.chrome.cdpProfileDir=D:\browseruse\profile-chrome-cdp

# CDP 调试端口。默认 0 = 让 Chrome 自己挑一个空闲端口(一定在 10000 以上),端口号从它的 stderr
# ("DevTools listening on ws://127.0.0.1:<port>/...")里读出来 —— 不会有端口被占用的启动失败,
# 同一台机器跑多个实例也不会互相踩。
#
# 刻意**不用 9222**:它不是 Chrome 的默认值(Chrome 要求显式指定),而是 Puppeteer / Selenium /
# chrome-remote-interface / VS Code 这些工具约定俗成用的端口。跟着用它,别的按默认值连 9222 的工具
# 会连到我们的浏览器上;反过来,别人手工起的调试实例也会占着端口让我们的启动失败(实测踩过)。
#
# 需要稳定端点(想用别的工具接上来看、或要固定防火墙规则)时,钉一个 **10000 以上**的端口:
# browser.chrome.debugPort=19222

# 追加到 Chrome 命令行的额外参数,逗号分隔。例如关掉用户装的扩展、指定语言、走代理:
# browser.chrome.extraArgs=--disable-extensions,--lang=zh-CN
#
# 只让**这个被自动化拉起来的 Chrome** 走代理(不动系统代理,也不影响本机其它程序):
# browser.chrome.extraArgs=--proxy-server=socks5://127.0.0.1:10808
# 实测:本机网络下 TradingView 的域名被解析到 104.244.46.21 / 157.240.7.5(Twitter / Facebook 的
# IP 段,典型的 DNS 污染),直连必然超时;走上面的 socks5 代理则正常。Chrome 的 socks5:// 是**代理端
# 解析域名**,所以这条同时绕开了污染。

# ---------------------------------------------------------------------------
# Chromium 沙箱(见 PlaywrightService.chromiumSandbox)
#
# 默认**开启**(Windows / macOS 这类普通桌面环境):本机 Chrome、内置 Chromium 与 Edge 的进程沙箱都能
# 正常工作,关掉它只会让隔离变差,并在窗口上多挂一条
#   You are using an unsupported command-line flag: --no-sandbox. Stability and security will suffer.
#
# Linux 上默认**关闭**(与以前的版本一致):服务多数跑在容器里、以 root 运行,而 Chrome 以 root 启动时会
# 直接报 "Running as root without --no-sandbox is not supported" 并退出。
#
# Edge 上默认也**开启**(它走的是自己拉进程 + CDP 那条路,不是 Playwright 的管道启动)。实测(Edge
# 145.0.3800.97 / Windows):开沙箱时,Playwright 的 --remote-debugging-pipe 会让 Edge 启动即退出(报
# Target page, context or browser has been closed),换成 --remote-debugging-port 就一切正常 ——
# 问题在「沙箱 + 管道」这个组合,所以解决办法是换启动方式,而不是关沙箱。
#
# 三种取值:true 始终开启 / false 始终关闭 / 不配按平台默认(非 Linux 开,Linux 关)。
# Linux 桌面(非 root、内核允许用户命名空间)想开就配 true。
#
# 注意 --no-sandbox 是 Playwright 自己加的(它的 chromiumSandbox 默认 false),这里开了它就不加;
# CDP 那条路(自己拉 Chrome)不经过 Playwright,关沙箱时由服务自己补这个参数 —— 两条路看同一个开关。
# ---------------------------------------------------------------------------
# browser.chromium.sandbox=true

# 托管 profile 的目录(默认走的那一份,所有任务共用)。
# 留空时是 ~/.config/browseruse/profiles/shared。agent 第一次登录某个站点后,登录态就留在这里,
# 后续任务不用再登;换目录等于换一套登录态。测试里会把它指到临时目录,免得污染开发机上那份。
# browser.profileDir=D:\browseruse\profile

# ---------------------------------------------------------------------------
# 浏览器类型:start 的 browser 参数(见 BrowserChoice)
#
# start 时可以按站点挑浏览器:{"method":"start","params":{"browser":"edge"}}。取值与落点:
#   auto(默认)  本机 Google Chrome,没装(或 browser.chrome.enabled=false)则内置 Chromium
#   chromium    只用内置的那份(发行包内嵌,开发态是 Playwright 自带的那份),不碰本机 Chrome
#   chrome      只用本机安装的 Google Chrome,没装直接失败
#   edge        只用本机安装的 Microsoft Edge,没装直接失败
#   firefox     只用 Playwright 自带的 Firefox
#
# 不传 browser 时用这里的默认值。auto 与其它取值的区别是「能不能悄悄换一个」:auto 会退让(本机没有
# Chrome 就用内置 Chromium),并把原因写进 start 返回的 data.browser.note;显式写了 chrome / edge 就是
# 「我就要这个」,没装会直接报错,不会偷偷换成别的浏览器。
#
# 一次只能有一个浏览器:浏览器与 profile 是全进程共用的,所以类型可以在任务之间切换(把在跑的任务
# close 掉再 start 就行,不用重启服务),但不能在任务运行中切换 —— 那会连累别人的页签,服务会明确报错。
#
# 想同时用两个浏览器(例如一边 Chrome 一边 Edge):再起一个服务进程,给它们配不同的端口与
# browser.profileDir / browser.edge.profileDir。
# ---------------------------------------------------------------------------
# browser.type=auto

# ---------------------------------------------------------------------------
# 浏览器引擎(见 BrowserEngine)
#
# 引擎只分 Chromium / Firefox 两档,是 browser.type 的一个子集:这里的 firefox 等价于
# browser.type=firefox,chromium(默认值)等价于 browser.type=auto。表达不了 Edge 与 Chrome 的区别 ——
# 要挑具体浏览器请用上面的 browser.type 或 start 的 browser 参数。
#
# 为什么要这个开关:有的站点在 Chromium 下用不了。中国商标网统一身份认证(sso.cnipa.gov.cn)
# 的 SPA 会做开发者工具检测(disable-devtool type 6),Chromium(本机 Chrome 与内嵌 Chromium 都一样)
# 会走到空白页 / HTTP 400;同一流程在 Firefox 139 下能正常渲染出登录表单。
# 对照记录见 playwright-server/target/cnipa-diagnosis/。
#
# 命令行覆盖示例:mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Dbrowser.engine=firefox"
#
# Firefox 与 Chromium 的差异(是引擎能力差异,不是配置问题):
#   - 没有 --no-sandbox / chromiumSandbox / --profile-directory,这些参数在 Firefox 下不传;
#   - page.pdf()(命令 pdf)只支持 Chromium,Firefox 下会返回明确的失败原因;
#   - 没有 CDP,所以 browser.chrome.useUserProfile(用你自己日常那份 Chrome profile)对 Firefox 无效;
#   - Playwright 的 Firefox 是打过补丁的构建(走 juggler 协议),本机安装的普通 Firefox 接不上,
#     所以默认用 Playwright 自己下载的那份,不要配 browser.firefox.path 指到本机 Firefox 上。
# ---------------------------------------------------------------------------
browser.engine=chromium

# 显式指定 Firefox 可执行文件;留空时交给 Playwright 解析它自己那份(推荐留空)
# browser.firefox.path=

# 追加到 Firefox 命令行的额外参数,逗号分隔
# browser.firefox.extraArgs=

# ---------------------------------------------------------------------------
# 窗口尺寸与页面视口(见 BrowserViewport)
#
# 这两件事以前被当成一件事,于是有了「页面比窗口还大」的毛病。现在分开看:
#
#   窗口尺寸:按屏幕的**可用工作区**算 —— 宽取 28/32、高取满。注意是工作区,任务栏不算在内
#             (老算法用 getScreenSize(),把任务栏也算进高度,窗口底边会被任务栏压住,压住的
#             那几十像素正好是页面底部;实测 1707x1067 的屏幕上工作区只有 1019)。
#   页面视口:见下面的 browser.viewport。
#
# browser.viewport 三档取值:
#
#   window(默认) 视口交给真实窗口:页面按窗口的实际内容区排版、拖动窗口页面跟着回流,
#                截图尺寸 = 窗口里真实可见的页面区 —— **所见即所得**。
#                无头模式没有真实窗口可跟随,配 window 会自动退回固定视口,并把原因写进
#                start 回执的 data.browser.viewport.note,不会静默失效。
#
#   fixed        一直用按屏幕算出来的固定尺寸(也就是以前的行为)。注意:**页面会比窗口高**,
#                多出来的部分渲染在窗口外面、人看不见,而截图照样拍进去(实测差约 13%,
#                正好是一页的底部)。什么时候用:需要固定尺寸截图做前后对比,或者站点只认固定视口。
#
#   宽x高        钉死一个尺寸,例如 1440x900(分隔符 x / * / × 都认,大小写不限)。
#
# 为什么默认从 fixed 改成 window:视口钉死时「页面上的视口高度」和「窗口里能看见的高度」对不上。
# 实测(旧默认,屏幕 1707x1067 的逻辑分辨率):页面自称 innerHeight = 1067,而窗口外框只有 1019,
# 再减掉标题栏/标签栏/地址栏约 88px,真实可见的页面区只剩约 931px —— 每页底部约 13% 渲染在
# 窗口外面。而 screenshot 是按 1067 拍的,于是**喂给视觉模型的画面和用户眼睛看到的不是一回事**;
# get_browser_state 的 viewport_height 也是这个数,元素在不在视口的判断同样受影响。
#
# 单个任务也能在运行时改视口:{"method":"set_viewport","params":{"width":1440,"height":900}}。
# 但 set_viewport 是**钉死**一个尺寸,钉死之后没有 API 再交还给窗口(Playwright 的
# Page.setViewportSize 只有 int 重载);要回到跟随窗口,请重新 start 一个任务。
#
# 只影响托管 profile 那条路(Playwright 的 launchPersistentContext)。CDP 那条路(用户自己的
# Chrome profile / Edge)本来就不套视口模拟,页面尺寸一直跟着窗口走。
#
# 截图的像素尺寸跟着视口策略走(Playwright 默认 scale=device,按设备像素出图):
#   window  -> devicePixelRatio 是真实系统 DPI 比,出图 = CSS 视口 × 该比值。
#              实测(这台机器 DPI 缩放 150%、视口 1470x925)出图 2205x1388,也就是屏幕上真实的物理像素。
#              要换算回 DOM 的 CSS 坐标,除以 devicePixelRatio。
#   fixed   -> deviceScaleFactor 是 1.0,出图 = CSS 视口那么大(实测 1484x1019),与 DOM 坐标 1:1。
#
# 想在这边把图压回 CSS 像素是做不到的(不是没试):Playwright 的 crPage.takeScreenshot 是
#   clip.scale /= (this._browserContext._options.deviceScaleFactor || 1)
# 除的是上下文选项里那个值,而它恰好被 viewport:null 禁止设置,于是 scale:"css" 在这里退化成
# 空操作(除 1)。所以「视口跟随窗口」与「CSS 像素截图」在 Playwright 里二选一:要后者用 fixed。
# ---------------------------------------------------------------------------
# browser.viewport=window

# ---------------------------------------------------------------------------
# 启动超时(毫秒,默认 60000)
#
# Playwright 自己默认给 180 秒,而正常启动只要几秒。**启动卡住时它不会报错,只会一直等到超时**,
# 180 秒的等待会把排查变成「等三分钟才看到一句话」,所以这里默认收到 60 秒。
#
# 最常见的「启动卡住」原因是:**上一次服务是被强制结束的**。浏览器是独立进程,杀掉服务不会关掉它,
# 残留的浏览器会一直占着 profile 目录。要清的是两个文件:parent.lock(「profile 正在被使用」标记)与
# .startup-incomplete(Firefox 启动开始时写下、启动完成时删掉,上次启动没走完它就留着,下次启动会走
# 「上次崩过」那条路而卡住)。服务在 Windows 上会自动清掉这两种残留(parent.lock 删得掉就说明没有活着的
# 持有者;删不掉说明真有一个实例在用,就什么都不动),并在启动失败时把这条原因写进错误信息里。
#
# 规范做法仍是**先关掉任务再停服务**(close 任务会把最后一个页签关掉、浏览器跟着退出)。
# browser.launch.timeoutMs=60000

# ---------------------------------------------------------------------------
# Microsoft Edge(start 时传 browser=edge 才用,见 EdgeBrowser)
#
# 探测顺序:browser.edge.path → 常见安装位置(Windows 上 %LOCALAPPDATA%\Microsoft\Edge\Application\
# msedge.exe 最常见 —— Edge 默认按用户安装)→ 注册表 App Paths\msedge.exe → PATH。
#
# Edge 用**自己一份托管 profile**(默认 ~/.config/browseruse/profiles/edge),与 Chrome 那份刻意分开:
# Edge 打开 Chrome 的 User Data 会把它当外来 profile 处理,两家 Cookie 的 App-Bound 加密密钥也不同,
# 混用只会得到一份读不出登录态的目录。所以换成 Edge 之后,Chrome 那份 profile 里的登录态用不上,
# 需要在 Edge 里重新登一次(登录态同样会留在这份 profile 里,后续任务不用再登)。
#
# 也不支持「用你自己日常那份 Edge profile」:原因与 Chrome 那边一样(Chrome/Edge 136 起不允许在默认
# 用户数据目录上开远程调试)。想直接用现成的登录态,请用 browser=chrome 配
# browser.chrome.useUserProfile。
#
# Edge 走的是「自己拉进程 + CDP」这条路(见 PlaywrightService.launchOverCdp),不是 Playwright 的
# launchPersistentContext —— 这样沙箱才能开着(见上面 Chromium 沙箱那段)。随之而来的两条差别:
#   - set_credentials(HTTP 基本认证)在这条路上用不了,会返回失败原因(需要就改用 browser=chrome);
#   - 页面触发的下载落到浏览器自己的下载目录,不是 ~/Downloads/broswer(pdf 命令不受影响)。
# start 返回里 data.browser.mode 是 cdp、type 是 edge、chrome 是 false。
# ---------------------------------------------------------------------------
browser.edge.enabled=true

# Edge 可执行文件。留空时按平台惯例探测(Windows 还会查注册表 App Paths\msedge.exe)
# browser.edge.path=C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe

# Edge 自己的托管 profile 目录。留空时是 ~/.config/browseruse/profiles/edge
# browser.edge.profileDir=D:\browseruse\profile-edge

# 追加到 Edge 命令行的额外参数,逗号分隔,例如 --lang=zh-CN
# browser.edge.extraArgs=

# ---------------------------------------------------------------------------
# 调用追踪日志(见 CommandTraceLog):每一次「请求 → 响应」都落一份到本地,便于排查与追踪。
#
# 落在 <启动目录>/logs/trace/<yyyyMMdd>/ 下:
#   steps.log                            每次调用一行(人看的时间线:序号/任务/方法/成败/耗时/关键字段)
#   calls.jsonl                          每次调用一行 JSON(摘要 + 完整请求体 + 批量每一步的成败)
#   000001-1001-get_browser_state.json   这一次调用的完整请求与完整响应(含整页 data.text)
#   uploads.log                          POST /playwright/upload 的落盘记录(文件名/大小/摘要,不含文件内容)
#
# 写盘失败(磁盘满、没权限)只留一条警告,不会让浏览器命令失败。
# ---------------------------------------------------------------------------
browser.trace.enabled=true

# 落盘根目录;留空时是 <启动目录>/logs/trace
# browser.trace.dir=E:\code\java\project-litongjava\deepseek-browser-use\logs\trace

# 单次调用完整报文的上限(字符数),超了截断并打标记。只有 screenshot 不带 path 时的 base64 大图可能撞到
# browser.trace.maxRecordChars=8000000

# 落盘前脱敏,默认开。填表这类任务里请求体带着姓名、手机号、证件号、详细地址,原文留在磁盘上迟早出问题。
# 内置规则:手机号、18 位身份证号/统一社会信用代码、邮箱、16~19 位长数字。
# 注意这是「尽力而为」:按模式匹配,不认识的个人信息(姓名、门牌号)不会被掩掉,交付前仍要自己看一眼。
browser.trace.redact.enabled=true

# 追加的自定义脱敏正则(逗号分隔),在内置规则之后生效。例如把公司名与商标名也掩掉:
# browser.trace.redact=某某科技有限公司,某某课堂
# browser.trace.redact.mask=***

# ---------------------------------------------------------------------------
# 动作类命令的超时与降级(见 PlaywrightService.clickWithMode / fillWithMode)
#
# 默认超时 5 秒:按索引操作元素时「元素已失效就尽快失败」。但有的站点(实测 ant-design 的 Vue SPA,
# 例如商标网上申请系统)可操作性检查本身就要好几秒,5 秒会把本来能成的点击判死 —— 这类站点上把它调大。
# ---------------------------------------------------------------------------
# browser.action.timeoutMs=5000

# 原生点击超时后是否自动改用 JS 派发事件(默认开)。
#
# 为什么需要:上面那类 SPA 上 Playwright 的 click 经常等满超时返回
# 「[ACTION_TIMEOUT] 等待元素可操作超时」,而元素明明在那里、点上去也有反应。这时唯一稳的办法是在页面里
# 直接派发 mousedown/mouseup/click —— 人手排障时也是这么做的。打开后服务会自动降级,并在回执里写明
# data.mode=js 与 fallbackReason,不会把「降级成功了」伪装成原生点击。
#
# 单次调用也可以自己指定:{"method":"click_element_by_index","params":{"index":12,"mode":"js"}}
#   mode=auto(默认) 先原生,失败再降级   mode=native 只用原生   mode=js 只用 JS 派发
# browser.action.jsFallback=true

# ---------------------------------------------------------------------------
# 自动截图与截图熔断(见 CapturePolicy / PlaywrightService.capture)
#
# 关键事实:Playwright 的 page.screenshot() 默认超时是 30 秒,而实测在 B 站投稿页这类页面上
# **一张都截不出来** —— 于是每条命令都要白等 30 秒,换来的却是没有任何画面。所以这里默认收到
# 8 秒,并在连续失败到阈值后熔断:熔断期间命令**不再为截图付时间**,回执里写明
# capture_degraded=true 与原因,让调用方知道自己现在是「盲操作」。
#
# 两类失败分开计数(这是实测踩出来的):
#   真失败 = 这个页面/这次会话截不出图 → 冷却 cooldownMs(默认 120 秒)
#   伪故障 = Playwright 事件分发投递过来的「对象已释放」→ 只冷却 spuriousCooldownMs(默认 15 秒)
# 冷却**到期后会半开**:计数清零,重新累计 failThreshold 次才再熔断。旧实现只在成功时清零,
# 于是熔断过一次之后有效阈值退化成 1 次失败,一次偶发超时又把画面关两分钟。
#
# 手动 screenshot 传 force=true 可以绕过冷却探测一次;探测失败**不延长**冷却(文档承诺的语义)。
#
# browser.capture.enabled=true
# browser.capture.timeoutMs=8000
# browser.capture.failThreshold=3
# browser.capture.cooldownMs=120000
# browser.capture.spuriousCooldownMs=15000

# ---------------------------------------------------------------------------
# execute_js 的时间预算(见 PlaywrightService.KEY_EVAL_TIMEOUT)
#
# 为什么必须有这一层:实测(2026-10-05,真服务)发现 page.evaluate 连它名义上的 30 秒默认超时都
# **不生效** —— 一个 40 秒后才 resolve 的 Promise 正常返回,一个永不 resolve 的 Promise 挂过
# 120 秒仍无响应。也就是说这条命令原本没有上限,调用方只能靠 HTTP 超时放弃,而放弃不会取消
# 服务端已经在跑的脚本。
#
# 现在服务端在页内包一层 Promise.race:即使脚本里的 Promise 永不 settle,evaluate 也一定会结束。
# 默认 60 秒,够跑「等一个慢接口」这类正常长脚本;单次调用可以用 params.timeoutMs 覆盖;
# 配成 0 = 不限制。
#
# browser.eval.timeoutMs=60000

# ---------------------------------------------------------------------------
# 命令级 wall-clock 兜底(见 ActionService.runBounded)
#
# 页内定时器只在页面 JS 还能跑时有效;渲染进程卡死 / CDP 半死时连它都救不了。这一层在服务端的
# 工作线程上等一个期限,拿不到就明确回一句「本次结果未知」(COMMAND_TIMEOUT),而不是让调用方无限等。
#
# 分两档,因为有些命令**本来就设计成要等**:
#   timeoutMs     普通命令(默认 90000):本来就该在几秒内返回的,超了就是卡住
#   hardTimeoutMs 「要等」的命令(默认 900000):批次/run_recipe、所有 wait_for_*、
#                 人机协同、pdf/download_image/ocr_image —— 它们的时间由自己的参数决定,
#                 用 90 秒一刀切会把 wait_for_idle(timeoutSeconds=300) 判死
#   maxStuck      同时允许多少条命令卡住(默认 24):超时的命令取消不掉,用有界线程池兜住;
#                 池满之后新命令会明确回「未执行、可以安全重试」,与「结果未知」区分开
#
# 0 = 关闭对应档位。
#
# browser.command.timeoutMs=90000
# browser.command.hardTimeoutMs=900000
# browser.command.maxStuck=24

# ---------------------------------------------------------------------------
# 网络事件记录模式(见 PlaywrightService.KEY_NETWORK_RECORD)
#
# 请求/响应监听器是实测里最贵的伪故障来源:Playwright Java 的页级事件实际挂在**上下文**上再按页
# 过滤,每开一个页签就多一份上下文级监听器;上下文事件分发一旦碰到已释放的对象就抛
# `Object doesn't exist: response@…`,并砸在**后续任意一次 API 调用**上(go_to_url / execute_js
# 成串报同一个已释放的 response@ 就是这个)。同一个类里 page.onDownload 已经因为完全相同的理由
# 被拆掉了,这四个是同一个分发面的剩下部分。
#
#   on(默认)  认领页签就挂。get_requests / get_response_body / wait_for_response 都是**回看**语义,
#              只有从一开始就在记,「导航 → 页面自己发 XHR → 再读」这条最常见的用法才成立
#              (两条既有用例钉住了这个语义:BrowserFrictionUpgradeTest.responseBodySurvivesNavigation、
#              BrowserResponseIntegrationTest.concurrentSameUrlResponsesKeepTheirIdsBodiesAndCallbackThread)。
#   lazy      第一次要读网络数据时才挂。挂上之前发生的请求**不会出现**(回执里的 recordedSince 会
#              说明从什么时候开始记),适合「只在明确查接口时才需要流量」的用法。
#   off       永不挂。回执会明说「没在记」,而不是给出一个会被误读成「没有请求」的空结果。
#              **踩到 response@/request@ 噪声风暴、又不需要网络数据时用它**:不订阅就不会有这个分发面,
#              这是唯一能彻底消掉那一族伪故障的设置。
#
# start 时可以用 networkRecording=true/false 按任务覆盖(true=on,false=off),不必改全局配置。
#
# browser.network.record=on

# 每个任务保留多少个响应(带 body)与多少条请求记录。默认 100 / 200。
# 单条响应体最多 10 万字符,所以 100 条约等于 1000 万字符/任务 —— 任务多、跑得久时想压内存就调小。
# browser.network.recentResponses=100
# browser.network.requests=200

# ---------------------------------------------------------------------------
# 文件暂存目录(见 UploadStore / UploadHandler):客户端-服务器模式下,智能体在客户端、浏览器在服务端,
# upload_file 的 path 必须是**服务端**能打开的路径,客户端先把文件 POST 到 /playwright/upload 再回填路径。
#
#   POST   /playwright/upload?filename=图样.jpg     请求体是文件字节(curl --data-binary @图样.jpg)
#   POST   /playwright/upload                       multipart/form-data,文件字段默认叫 file(curl -F "file=@图样.jpg")
#   POST   /playwright/upload                       application/json:{"filename":"图样.jpg","contentBase64":"..."}
#   GET    /playwright/upload                       列出暂存目录里的文件
#   DELETE /playwright/upload?name=图样.jpg         删除一个文件
#
# 回执里的 path(服务端绝对路径)与 relativePath(相对暂存目录的名字)都可以直接喂给 upload_file。
# 文件名会被清洗(只留基本名、去掉路径分隔符与控制字符,保留中文),并且只能落在暂存目录里。
# ---------------------------------------------------------------------------
browser.upload.enabled=true

# 暂存目录;留空时是 <启动目录>/upload
# browser.upload.dir=D:\browseruse\upload

# ---------------------------------------------------------------------------
# 批量命令上限(见 ActionService.batchExecute):一次 commands 请求最多多少条,默认 200。
# 与服务端要扛多久直接相关 —— 超时、并发、网络保留深度都可配,唯独这一项原来写死在代码里。
# browser.command.maxPerBatch=200
#
# 伪故障重发的次数与间隔(见 ActionService.dispatchWithSpuriousRetry)。默认 3 次 / 120ms。
# 3 次以内是「消息泵里正在派发的那一条」,再多就是别的问题了;噪声风暴的站点可以把间隔调大。
# browser.command.spuriousMaxAttempts=3
# browser.command.spuriousRetryDelayMs=120

# diff_dom_text 每侧最多回多少行。默认 200。页面改动很大时调小可以让回执更短。
# browser.diff.maxLines=200

# ---------------------------------------------------------------------------
# 异步任务(见 JobRegistry):最多保留多少个任务记录、同时最多跑几个长任务。默认 50 / 2。
# 并发数是**类初始化**时建的线程池大小,改了要重启服务才生效。
# browser.jobs.max=50
# browser.jobs.maxConcurrency=2

# ---------------------------------------------------------------------------
# 单文件上限(字节),0 表示不限。默认 50MB —— 与引擎上限一致:
# 本服务用 connectOverCDP 附着浏览器,Playwright 把这类浏览器视为「不与本机同址」,
# setInputFiles 对它有 50MB 的传输上限且不可配置;配得比引擎大只会让文件过了我们的闸门、
# 然后死在引擎里,并且报一句不带 errorCode 的英文错误。
# browser.upload.maxBytes=52428800

# 同名文件是覆盖(true,默认,重复上传同一份文件得到同一个路径)还是自动改名(false,a.jpg → a-1.jpg)
# browser.upload.overwrite=true
